<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articolo Blog - IncanTour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/spirale_incantour_highres%20%281%29-7hzjNru1zG0Gbw6WqE4bJuWZ3FzOU2.png">
    <style>
        html { scroll-behavior: smooth; }
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-orange: #E6A532;
            --primary-orange-dark: #D4941A;
            --primary-teal: #1B5E5F;
            --primary-teal-dark: #0F4142;
            --gradient-primary: linear-gradient(135deg, #E6A532 0%, #D4941A 25%, #1B5E5F 75%, #0F4142 100%);
            --gradient-warm: linear-gradient(135deg, #E6A532 0%, #D4941A 100%);
            --gradient-cool: linear-gradient(135deg, #1B5E5F 0%, #0F4142 100%);
        }
        
        * {
            font-family: 'Poppins', sans-serif;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            flex-direction: column;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid var(--primary-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .blog-featured-image {
            width: 100%;
            height: 550px;
            object-fit: cover;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            margin-bottom: 2.5rem;
        }

        .blog-content {
            font-size: 1.125rem;
            line-height: 1.85;
            color: #374151;
        }

        .blog-content p {
            margin-bottom: 1.75rem;
        }

        .blog-content h2 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-teal);
            margin-top: 2.5rem;
            margin-bottom: 1.25rem;
        }

        .blog-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-orange);
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .blog-content blockquote {
            border-left: 4px solid var(--primary-orange);
            background: #fffdf9;
            padding: 1.5rem 2rem;
            border-radius: 0 16px 16px 0;
            font-style: italic;
            margin: 2rem 0;
            color: #4b5563;
        }

        .blog-content img {
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin: 2rem auto;
            max-width: 100%;
            height: auto;
        }

        .navbar.scrolled {
            background: linear-gradient(135deg, rgba(230, 165, 50, 0.98) 0%, rgba(212, 148, 26, 0.98) 25%, rgba(27, 94, 95, 0.98) 75%, rgba(15, 65, 66, 0.98) 100%);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(230, 165, 50, 0.2);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <iframe src="navbar.html" onload="this.before((this.contentDocument.body||this.contentDocument).children[0]);this.remove()"></iframe>

    <!-- Breadcrumb -->
    <section class="breadcrumb pt-28 pb-4 bg-white border-b border-gray-100">
        <div class="container mx-auto px-6 max-w-6xl">
            <div class="flex items-center justify-between">
                <nav class="text-sm text-gray-600">
                    <a href="../index.html" class="hover:text-amber-500 transition font-medium">Home</a>
                    <span class="mx-2 text-gray-400">/</span>
                    <a href="blog.html" class="hover:text-amber-500 transition font-medium">Blog</a>
                    <span class="mx-2 text-gray-400">/</span>
                    <span class="text-amber-600 font-semibold">Articolo</span>
                </nav>

                <a href="blog.html" class="inline-flex items-center gap-2 text-xs font-bold text-teal-900 hover:text-amber-600 transition bg-gray-100 hover:bg-amber-50 px-4 py-2 rounded-full border border-gray-200">
                    <i class="fas fa-arrow-left"></i> Torna al Blog
                </a>
            </div>
        </div>
    </section>

    <!-- Main Container (Increased width to max-w-6xl) -->
    <main class="container mx-auto px-6 py-12 max-w-6xl">
        <article id="blog-post" class="blog-post bg-white rounded-3xl p-8 md:p-14 shadow-xl border border-gray-100">
            <!-- Blog post content will be dynamically loaded here -->
            <div class="loading">
                <div class="loading-spinner"></div>
                <p class="text-gray-600 text-base font-medium">Caricamento articolo in corso...</p>
            </div>
        </article>
    </main>

    <iframe src="footer.html" onload="this.before((this.contentDocument.body||this.contentDocument).children[0]);this.remove()"></iframe>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
