<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dettaglio Tour - IncanTour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/spirale_incantour_highres%20%281%29-7hzjNru1zG0Gbw6WqE4bJuWZ3FzOU2.png">
    <style>
        html { scroll-behavior: smooth; }
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-orange: #E6A532;
            --primary-orange-dark: #D4941A;
            --primary-teal: #1B5E5F;
            --primary-teal-dark: #0F4142;
            --gradient-primary: linear-gradient(135deg, #E6A532 0%, #D4941A 25%, #1B5E5F 75%, #0F4142 100%);
            --gradient-warm: linear-gradient(135deg, #E6A532 0%, #D4941A 100%);
            --gradient-cool: linear-gradient(135deg, #1B5E5F 0%, #0F4142 100%);
        }
        
        * {
            font-family: 'Poppins', sans-serif;
        }
        
        .spiral-rotate {
            animation: spiralRotate 20s linear infinite;
        }
        
        @keyframes spiralRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .fade-in {
            animation: fadeIn 1s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in-up {
            animation: slideInUp 0.8s ease-out;
        }
        
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .gradient-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            flex-direction: column;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid var(--primary-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .tour-header {
            position: relative;
            height: 70vh;
            overflow: hidden;
            border-radius: 0 0 30px 30px;
            margin-bottom: 3rem;
        }
        
        .tour-featured-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .tour-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(230, 165, 50, 0.3), rgba(27, 94, 95, 0.6));
            z-index: 1;
        }
        
        .tour-header-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 3rem;
            color: white;
            z-index: 2;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
        }
        
        .tour-header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .tour-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: center;
        }
        
        .tour-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-orange);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .tour-duration,
        .tour-location {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .tour-content {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            line-height: 1.8;
            font-size: 1.1rem;
            color: #374151;
        }
        
        .tour-content h2,
        .tour-content h3 {
            color: var(--primary-teal);
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        
        .tour-content p {
            margin-bottom: 1.5rem;
        }
        
        .tour-details {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .tour-details h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--primary-teal);
        }
        
        .tour-features {
            list-style: none;
            padding: 0;
        }
        
        .tour-features li {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 1.1rem;
        }
        
        .tour-features li:last-child {
            border-bottom: none;
        }
        
        .tour-features i {
            width: 24px;
            color: var(--primary-orange);
            font-size: 1.2rem;
        }
        
        .tour-cta {
            text-align: center;
            padding: 3rem 0;
        }
        
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--gradient-warm);
            color: white;
            padding: 1.25rem 3rem;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(230, 165, 50, 0.3);
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(230, 165, 50, 0.4);
        }
        
        .error-message {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 20px;
            margin: 2rem auto;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .error-message h2 {
            font-size: 2.5rem;
            color: var(--primary-teal);
            margin-bottom: 1rem;
        }
        
        .error-message p {
            font-size: 1.2rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }
        
        .breadcrumb {
            padding: 2rem 0;
            background: #f9fafb;
        }
        
        .breadcrumb-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        
        .breadcrumb a {
            color: var(--primary-teal);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .breadcrumb a:hover {
            color: var(--primary-orange);
        }
        
        .breadcrumb span {
            color: #6b7280;
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .booking-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .booking-widget:hover {
            transform: scale(1.1);
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .tour-header h1 {
                font-size: 2rem;
            }
            
            .tour-price {
                font-size: 2rem;
            }
            
            .tour-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .tour-header-content {
                padding: 2rem;
            }
            
            .tour-content,
            .tour-details {
                padding: 2rem;
            }
        }

        /* Mobile Menu Styles */
        .mobile-menu {
            background: linear-gradient(135deg, rgba(230, 165, 50, 0.98) 0%, rgba(212, 148, 26, 0.98) 25%, rgba(27, 94, 95, 0.98) 75%, rgba(15, 65, 66, 0.98) 100%);
            backdrop-filter: blur(10px);
        }

        .mobile-menu button,
        .mobile-menu a {
            color: white !important;
        }

        .mobile-menu button:hover,
        .mobile-menu a:hover {
            color: var(--primary-orange) !important;
        }

        .blog-card {
            background: white;
            border-radius: 0.5rem;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .blog-card img {
            transition: transform 0.3s ease;
        }
        
        .blog-card:hover img {
            transform: scale(1.05);
        }

        /* Dropdown menu links: readable dark text on white dropdown card */
        .navbar .nav-links .absolute a,
        .navbar.scrolled .nav-links .absolute a {
            color: #1f2937 !important;
            display: block;
            background-color: transparent !important;
            transition: all 0.2s ease;
        }

        .navbar .nav-links .absolute a:hover,
        .navbar.scrolled .nav-links .absolute a:hover {
            color: #E6A532 !important;
            background-color: #f9fafb !important;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <style>
        html { scroll-behavior: smooth; }
        .navbar {
            background: linear-gradient(135deg, rgba(230, 165, 50, 0.98) 0%, rgba(212, 148, 26, 0.98) 25%, rgba(27, 94, 95, 0.98) 75%, rgba(15, 65, 66, 0.98) 100%);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(230, 165, 50, 0.2);
        }
        
        .navbar.scrolled .nav-links > a,
        .navbar.scrolled .nav-links > button,
        .navbar.scrolled .nav-agency-link,
        .navbar.scrolled a[href*="agencyservices"] {
            color: #E6A532 !important;
        }

        .navbar.scrolled .nav-links > a:hover,
        .navbar.scrolled .nav-links > button:hover,
        .navbar.scrolled .nav-agency-link:hover,
        .navbar.scrolled a[href*="agencyservices"]:hover {
            color: white !important;
        }

        .navbar.scrolled .nav-links > a.active,
        .navbar.scrolled .nav-links > button.active,
        .navbar.scrolled .nav-agency-link.active,
        .navbar.scrolled a[href*="agencyservices"].active {
            color: white !important;
        }
        
        .navbar.scrolled .nav-links a.active {
            color: #E6A532 !important;
        }
    
        </style>
    
    
        <iframe src="navbar.html" onload="this.before((this.contentDocument.body||this.contentDocument).children[0]);this.remove()"></iframe>

    <!-- Breadcrumb -->
    <section class="breadcrumb mt-20">
        <div class="breadcrumb-content">
            <nav class="text-sm">
                <a href="../index.html" class="hover:text-orange-500 transition-colors duration-300">Home</a>
                <span class="mx-2">/</span>
                <a href="tours.html" class="hover:text-orange-500 transition-colors duration-300">Pacchetti Tour</a>
                <span class="mx-2">/</span>
                <span>Dettagli Tour</span>
            </nav>
        </div>
    </section>

    <main class="container mx-auto px-6 pb-20">
        <!-- Main content with sidebar -->
        <section id="tour-detail" class="tour-detail">
            <div class="flex flex-col lg:flex-row gap-8">
                <!-- Tour content will be dynamically loaded here -->
                <div class="flex-grow">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p class="text-gray-600 text-lg">Caricamento dettagli del tour in corso...</p>
                    </div>
                </div>
                
                <!-- Related Blogs Sidebar -->
                <div class="lg:w-1/3">
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <h3 class="text-xl font-semibold text-primary-teal mb-4">Articoli del Blog Correlati</h3>
                        <div id="related-blogs" class="space-y-4">
                            <div class="animate-pulse space-y-4">
                                <div class="h-48 bg-gray-200 rounded"></div>
                                <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Floating Booking Widget -->
    <div class="booking-widget">
        <button class="w-16 h-16 rounded-full text-white shadow-2xl flex items-center justify-center pulse-animation" style="background: var(--gradient-warm);">
            <i class="fas fa-calendar-plus text-xl"></i>
        </button>
    </div>


    <iframe src="footer.html" onload="this.before((this.contentDocument.body||this.contentDocument).children[0]);this.remove()"></iframe>


    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script>
        // Enhanced tour detail page functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Navbar scroll effect
            const navbar = document.querySelector('.navbar');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });

            // Smooth scrolling for anchor links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
        });

        // Your existing tour loading script (preserved exactly)
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tourId = urlParams.get('id');
            
            if (!tourId) {
                window.location.href = 'tours.html';
                return;
            }

            try {
                const tour = await TourAPI.getTourById(tourId);
                if (!tour) throw new Error('Tour not found');

                const basePriceValue = tour.acf?.Price ? parseFloat(tour.acf.Price) : 0;
                const basePrice = Number.isFinite(basePriceValue) ? basePriceValue.toFixed(2) : '0.00';
                const mainContent = document.querySelector('#tour-detail');
                
                // Clear the loading state
                mainContent.innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-8">
                        <div class="flex-grow">
                            <div class="tour-header fade-in">
                                <img src="${tour._embedded?.['wp:featuredmedia']?.[0]?.source_url || '../assets/images/default-tour.jpg'}" 
                                     alt="${tour.title.rendered}" 
                                     class="tour-featured-image">
                                <div class="tour-header-content">
                                    <h1>${tour.title.rendered}</h1>
                                    <div class="tour-meta">
                                        <div class="tour-price">
                                            <span>€${basePrice}</span>
                                        </div>
                                        ${tour.acf?.Duration ? `
                                        <div class="tour-duration">
                                            <i class="fas fa-clock"></i>
                                            <span>${tour.acf.Duration}</span>
                                        </div>
                                        ` : ''}
                                        ${tour.acf?.Location ? `
                                        <div class="tour-location">
                                            <i class="fas fa-map-marker-alt"></i>
                                            <span>${tour.acf.Location}</span>
                                        </div>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="tour-content slide-in-up">
                                ${tour.content.rendered}
                            </div>
                            <div class="tour-cta slide-in-up mb-8">
                                <div class="booking-options mt-8">
                                    <div class="flex flex-col md:flex-row items-start md:items-center justify-between p-6 bg-gray-50 rounded-lg space-y-4 md:space-y-0">
                                        <div class="flex flex-col space-y-2 w-full md:w-auto">
                                            <label for="quantity" class="font-medium text-gray-700">Numero di Viaggiatori:</label>
                                            <div class="flex items-center border rounded-md bg-white">
                                                <button type="button" class="px-4 py-2 text-gray-600 hover:text-orange-500 decrement-qty transition-colors duration-300">
                                                    <i class="fas fa-minus"></i>
                                                </button>
                                                <input type="number" 
                                                       id="quantity" 
                                                       class="w-20 text-center border-x py-2 focus:outline-none focus:border-orange-500" 
                                                       value="1" 
                                                       min="1" 
                                                       max="10"
                                                       readonly>
                                                <button type="button" class="px-4 py-2 text-gray-600 hover:text-orange-500 increment-qty transition-colors duration-300">
                                                    <i class="fas fa-plus"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="flex flex-col space-y-2 w-full md:w-auto">
                                            <span class="font-medium text-gray-700">Prezzo Totale:</span>
                                            <div class="text-2xl font-bold" style="color: var(--primary-teal);">
                                                <span class="tour-total">€${basePrice}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex justify-center items-center gap-4 mt-6">
                                    <button data-product-id="${tour.id}" class="book-now cta-button">
                                        <i class="fas fa-calendar-check"></i> Prenota Ora
                                    </button>
                                </div>
                            </div>
                            ${tour.acf?.Tags ? `
                            <div class="mt-4 mb-8">
                                <h3 class="text-xl font-semibold mb-4">Tags</h3>
                                <div class="flex flex-wrap gap-2">
                                    ${tour.acf.Tags.split(',').map(tag => `
                                        <span class="tag px-4 py-2 bg-gradient-to-r from-teal-600 to-teal-700 text-white rounded-full text-sm">${tag.trim()}</span>
                                    `).join('')}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                        
                        <!-- Related Blogs Sidebar -->
                        <div class="lg:w-1/3">
                            <div class="bg-white rounded-lg shadow-lg p-6">
                                <h3 class="text-xl font-semibold text-primary-teal mb-4">Articoli del Blog Correlati</h3>
                                <div id="related-blogs" class="space-y-4">
                                    <div class="animate-pulse space-y-4">
                                        <div class="h-48 bg-gray-200 rounded"></div>
                                        <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // Booking quantity and redirect handling
                const quantityInput = document.getElementById('quantity');
                const decrementQtyButton = document.querySelector('.decrement-qty');
                const incrementQtyButton = document.querySelector('.increment-qty');
                const totalPriceElement = document.querySelector('.tour-total');
                const bookNowButton = document.querySelector('.book-now');

                const updateTotalPrice = () => {
                    const quantity = Math.max(1, Math.min(10, parseInt(quantityInput.value, 10) || 1));
                    quantityInput.value = quantity;
                    const total = (parseFloat(basePrice) * quantity).toFixed(2);
                    totalPriceElement.textContent = `€${total}`;
                };

                decrementQtyButton?.addEventListener('click', () => {
                    const currentValue = parseInt(quantityInput.value, 10) || 1;
                    if (currentValue > 1) {
                        quantityInput.value = currentValue - 1;
                        updateTotalPrice();
                    }
                });

                incrementQtyButton?.addEventListener('click', () => {
                    const currentValue = parseInt(quantityInput.value, 10) || 1;
                    if (currentValue < 10) {
                        quantityInput.value = currentValue + 1;
                        updateTotalPrice();
                    }
                });

                bookNowButton?.addEventListener('click', () => {
                    const quantity = Math.max(1, Math.min(10, parseInt(quantityInput.value, 10) || 1));
                    const bookingUrl = `booking.html?tour=${encodeURIComponent(tour.id)}&quantity=${encodeURIComponent(quantity)}&price=${encodeURIComponent(basePrice)}`;
                    window.location.href = bookingUrl;
                });

                updateTotalPrice();

                // Load related blogs if tags exist
                if (tour.acf?.Tags) {
                    try {
                        const tags = tour.acf.Tags.split(',').map(tag => tag.trim());
                        const relatedBlogs = await TourAPI.getRelatedPosts(tags, 3);
                        
                        const relatedBlogsContainer = document.getElementById('related-blogs');
                        if (relatedBlogsContainer) {
                            if (relatedBlogs && relatedBlogs.length) {
                                relatedBlogsContainer.innerHTML = relatedBlogs.map(blog => `
                                    <div class="blog-card hover:shadow-lg transition-shadow duration-300">
                                        <a href="blog-post.html?id=${blog.id}" class="block">
                                            <img src="${blog.featured_image_url}" 
                                                 alt="${blog.title.rendered}"
                                                 class="w-full h-48 object-cover rounded-lg">
                                            <h4 class="font-semibold mt-3 text-gray-800">${blog.title.rendered}</h4>
                                            <p class="text-sm text-gray-500 mt-2">
                                                <i class="fas fa-calendar-alt mr-2 text-xs"></i>${new Date(blog.date).toLocaleDateString()}
                                            </p>
                                        </a>
                                    </div>
                                `).join('');
                            } else {
                                relatedBlogsContainer.innerHTML = `
                                    <div class="text-center py-6">
                                        <p class="text-gray-500">Nessun articolo del blog correlato trovato</p>
                                    </div>
                                `;
                            }
                        }
                    } catch (error) {
                        console.error('Error loading related posts:', error);
                        const relatedBlogsContainer = document.getElementById('related-blogs');
                        if (relatedBlogsContainer) {
                            relatedBlogsContainer.innerHTML = `
                                <div class="text-center py-6">
                                    <p class="text-gray-500">Impossibile caricare gli articoli correlati</p>
                                </div>
                            `;
                        }
                    }
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('tour-detail').innerHTML = `
                    <div class="error-message fade-in">
                        <h2>Error Loading Tour</h2>
                        <p>${error.message}</p>
                        <a href="tours.html" class="cta-button mt-6">View All Tours</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
